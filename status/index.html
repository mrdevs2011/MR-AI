<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>mragent — kompyuter holati</title>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f10;
    color: #ececec;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    text-align: center;
    padding: 48px 56px;
    border-radius: 24px;
    background: #18181a;
    border: 1px solid #2a2a2c;
  }
  .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 10px;
    vertical-align: middle;
  }
  .dot.online { background: #3ddc84; box-shadow: 0 0 12px #3ddc84; }
  .dot.offline { background: #f2555a; box-shadow: 0 0 12px #f2555a; }
  .dot.loading { background: #8e8e8e; }
  .logo {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    transition: filter 0.3s ease;
  }
  .logo img { width: 100%; height: 100%; display: block; }
  .logo.online { filter: drop-shadow(0 0 10px rgba(61, 220, 132, 0.55)); }
  .logo.offline { filter: grayscale(1) opacity(0.5); }
  .logo.loading { filter: grayscale(1) opacity(0.6); }
  .status-text {
    font-size: 28px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
  }
  .sub {
    margin-top: 12px;
    font-size: 14px;
    color: #8e8e8e;
  }
  .login-box {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid #2a2a2c;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .login-box input {
    background: #0f0f10;
    border: 1px solid #2a2a2c;
    color: #ececec;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
  }
  .login-box input:focus { border-color: #3ddc84; }
  .login-box button {
    background: #3ddc84;
    color: #0f0f10;
    border: none;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .login-box button:disabled { opacity: 0.5; cursor: default; }
  .login-result {
    font-size: 12px;
    word-break: break-all;
    color: #8e8e8e;
    min-height: 16px;
  }
  .login-result.ok { color: #3ddc84; }
  .login-result.err { color: #f2555a; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo loading" id="logo"><img src="splash.svg" alt="mragent"></div>
    <div class="status-text"><span class="dot loading" id="dot"></span><span id="label">Tekshirilmoqda...</span></div>
    <div class="sub" id="sub">&nbsp;</div>

    <div class="login-box">
      <input type="password" id="passInput" placeholder="Login parol" autocomplete="off">
      <button id="loginBtn">Auth token olish</button>
      <div class="login-result" id="loginResult"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDYkT1b_SOg5T76yhpyRuqnem9YsG53Qn0",
      authDomain: "mragent-2d280.firebaseapp.com",
      projectId: "mragent-2d280",
      storageBucket: "mragent-2d280.firebasestorage.app",
      messagingSenderId: "654437071743",
      appId: "1:654437071743:web:7281d306d8c6cd054c784a",
      measurementId: "G-MZEC0M55WH"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const dot = document.getElementById("dot");
    const label = document.getElementById("label");
    const sub = document.getElementById("sub");
    const logo = document.getElementById("logo");

    // Heartbeat 20 soniyada bir marta yoziladi (bkg/main.py). Agar oxirgi
    // yozuv 60 soniyadan eski bo'lsa, backend/kompyuter o'chgan deb hisoblanadi.
    const STALE_AFTER_MS = 60 * 1000;

    async function checkStatus() {
      try {
        const doc = await db.collection("config").doc("heartbeat").get();
        if (!doc.exists || !doc.data().lastSeen) {
          setOffline("Hech qachon ulanmagan");
          return;
        }
        const lastSeen = doc.data().lastSeen.toDate();
        const ageMs = Date.now() - lastSeen.getTime();
        if (ageMs < STALE_AFTER_MS) {
          setOnline(lastSeen);
        } else {
          setOffline(formatAgo(ageMs));
        }
      } catch (e) {
        label.textContent = "Xatolik";
        sub.textContent = "Firestore bilan bog'lanib bo'lmadi";
        dot.className = "dot offline";
      }
    }

    function setOnline(lastSeen) {
      dot.className = "dot online";
      logo.className = "logo online";
      label.textContent = "Kompyuter YONIQ";
      sub.textContent = "Oxirgi signal: " + lastSeen.toLocaleTimeString();
    }

    function setOffline(detail) {
      dot.className = "dot offline";
      logo.className = "logo offline";
      label.textContent = "Kompyuter O'CHIQ";
      sub.textContent = detail;
    }

    function formatAgo(ms) {
      const mins = Math.floor(ms / 60000);
      if (mins < 1) return "Bir necha soniya oldin uzildi";
      if (mins < 60) return mins + " daqiqa oldin oxirgi marta ko'rilgan";
      const hours = Math.floor(mins / 60);
      return hours + " soat oldin oxirgi marta ko'rilgan";
    }

    checkStatus();
    setInterval(checkStatus, 10000); // har 10 soniyada qayta tekshiradi

    // --- PASS kiritib AUTH_TOKEN olish ---
    // Backend URL'ni qo'lda yozmaymiz — Firestore'dagi config/tunnel
    // hujjatida allaqachon bor (cloudflared tunnel har start'da o'zini
    // shu yerga yozadi), status page ham shu manbadan o'qiydi.
    const passInput = document.getElementById("passInput");
    const loginBtn = document.getElementById("loginBtn");
    const loginResult = document.getElementById("loginResult");

    async function getBackendUrl() {
      const doc = await db.collection("config").doc("tunnel").get();
      if (!doc.exists || !doc.data().url) {
        throw new Error("Backend manzili topilmadi (tunnel offline bo'lishi mumkin)");
      }
      return doc.data().url.replace(/\/$/, "");
    }

    async function doLogin() {
      const pass = passInput.value.trim();
      if (!pass) {
        loginResult.textContent = "Parolni kirit avval, bratan.";
        loginResult.className = "login-result err";
        return;
      }
      loginBtn.disabled = true;
      loginResult.textContent = "Tekshirilmoqda...";
      loginResult.className = "login-result";
      try {
        const backendUrl = await getBackendUrl();
        const res = await fetch(backendUrl + "/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pass })
        });
        if (res.status === 401) {
          loginResult.textContent = "Parol noto'g'ri.";
          loginResult.className = "login-result err";
          return;
        }
        if (!res.ok) {
          loginResult.textContent = "Server xatosi: " + res.status;
          loginResult.className = "login-result err";
          return;
        }
        const data = await res.json();
        loginResult.textContent = "TOKEN: " + data.token + "  (bosib nusxalash uchun)";
        loginResult.className = "login-result ok";
        loginResult.style.cursor = "pointer";
        loginResult.onclick = () => {
          navigator.clipboard.writeText(data.token);
          loginResult.textContent = "Nusxalandi ✓";
        };
      } catch (e) {
        loginResult.textContent = "Xatolik: " + e.message;
        loginResult.className = "login-result err";
      } finally {
        loginBtn.disabled = false;
      }
    }

    loginBtn.addEventListener("click", doLogin);
    passInput.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
  </script>
</body>
</html>
