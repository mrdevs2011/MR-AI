<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRagent</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" href="assets/splash.svg" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body class="text-[#ececec] h-screen flex flex-col" style="background:var(--bg);">

  <!-- =================== BOOT (checking auth) =================== -->
  <div id="boot-screen" class="h-screen w-screen flex items-center justify-center" style="background:var(--bg);">
    <div class="flex flex-col items-center gap-3">
      <div class="w-6 h-6 rounded-full border-2 border-[#4d4d4d] border-t-[#ececec] animate-spin"></div>
    </div>
  </div>

  <!-- =================== LOGIN SCREEN =================== -->
  <div id="login-screen" class="hidden h-screen w-screen flex items-center justify-center" style="background:var(--bg);">
    <form id="login-form" class="login-card w-full max-w-[400px] p-8 space-y-6">
      <div class="text-center space-y-2">
        <div class="w-9 h-9 mx-auto">
          <img src="assets/MRagent-logo.svg" alt="MRagent" width="100%" height="100%" />
        </div>
        <h1 class="font-semibold text-2xl tracking-tight text-[#ececec]">Continue to MRagent</h1>
      </div>

      <div class="space-y-3">
        <div class="space-y-1.5" id="login-pass-wrap">
          <input id="login-pass" type="password" autocomplete="current-password"
                 class="login-input w-full rounded-xl px-4 py-3 text-[15px] text-[#ececec] focus:outline-none placeholder:text-[#8e8e8e]"
                 placeholder="Login password" required />
        </div>
        <div class="space-y-2 hidden px-2" id="login-otp-wrap">
          <div id="login-otp-boxes" class="flex justify-between gap-2.5"></div>
          <input type="hidden" id="login-otp" />
          <p id="login-otp-timer" class="text-[13px] text-[#8e8e8e] text-center hidden"></p>
        </div>
      </div>

      <p id="login-error" class="text-[13px] text-[#f2555a] hidden">Wrong password, or the backend didn't respond.</p>

      <button type="submit" id="login-btn"
              class="w-full bg-[#ececec] hover:bg-white text-[#212121] rounded-xl py-3 text-[15px] font-medium transition disabled:opacity-40">
        Continue
      </button>

    </form>
  </div>

  <!-- =================== CHAT APP (shown after login) =================== -->
  <div id="app-screen" class="hidden h-screen flex" style="background:var(--bg);">

    <!-- =================== SIDEBAR =================== -->
    <aside id="sidebar" class="shrink-0 flex flex-col sidebar-collapsible">
      <!-- Header brand: pinned/preview da yuqori chapda, icon bilan bir qator (Claude uslubi) -->
      <div id="sidebar-brand" class="hidden">
        <div class="brand-orb w-6 h-6 rounded-full overflow-hidden shrink-0" style="background:#ececec;">
          <img class="brand-orb-static" src="assets/MRagent-logo.svg" alt="MRagent" width="100%" height="100%" />
          <video class="brand-orb-video" src="assets/circle2_transparent.webm" autoplay loop muted playsinline></video>
        </div>
        <span>MRagent</span>
      </div>
      <div id="sidebar-top-content" class="px-3 py-3 space-y-0.5 sidebar-fade">
        <button id="new-chat-btn"
                class="sidebar-item sidebar-nav-item w-full flex items-center gap-2.5 hover:bg-[#2a2a2a] rounded-lg px-3 py-1.5 text-[#ececec] text-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0">
            <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
          </svg>
          New
        </button>
        <button id="bash-btn"
                class="sidebar-item sidebar-nav-item w-full flex items-center gap-2.5 hover:bg-[#2a2a2a] rounded-lg px-3 py-1.5 text-[#ececec] text-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0">
            <polyline points="4 17 10 11 4 5" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="12" y1="19" x2="20" y2="19" stroke-linecap="round"/>
          </svg>
          Bash
        </button>
        <button id="replay-btn"
                class="sidebar-item sidebar-nav-item w-full flex items-center gap-2.5 hover:bg-[#2a2a2a] rounded-lg px-3 py-1.5 text-[#ececec] text-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          Replay
        </button>
      </div>

      <div class="px-3 mt-1 sidebar-fade">
        <div class="sidebar-search-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0">
            <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/>
          </svg>
          <input id="chat-search" type="text" placeholder="Search chats" autocomplete="off" />
        </div>
      </div>

      <div class="px-3 mt-5 flex-1 min-h-0 flex flex-col sidebar-fade">
        <p class="sidebar-section-label px-3 mb-1">Chats</p>
        <div id="chat-history" class="text-sm text-[#d9d9d9] overflow-y-auto flex-1 min-h-0">
          <!-- filled by JS -->
        </div>
      </div>

      <div class="sidebar-footer-row sidebar-fade">
        <div class="sidebar-item flex-1 flex items-center gap-2.5 rounded-lg px-2 py-2 min-w-0 hover:bg-[#2a2a2a]">
          <div class="w-7 h-7 rounded-full overflow-hidden shrink-0" id="footer-logo-wrap" style="background:#ececec; position:relative;">
            <img id="footer-logo" src="assets/MRagent-logo.svg" alt="MRagent" width="100%" height="100%" />
          </div>
          <div class="min-w-0">
            <p class="text-[13px] truncate text-[#ececec]">MRagent</p>
            <p class="text-[11px] text-[#8e8e8e]" id="tunnel-status">connecting...</p>
          </div>
        </div>
        <button id="logout-btn" class="sidebar-footer-action shrink-0">
          sign out
        </button>
      </div>
    </aside>

    <!-- Darkened backdrop behind the sidebar when it's opened as a
         slide-over on mobile; tapping it closes the sidebar again. -->
    <div id="sidebar-backdrop" class="hidden"></div>

    <!-- =================== MAIN CHAT =================== -->
    <div id="chat-panel" class="flex-1 flex flex-col min-w-0 relative" style="background:var(--bg);">
      <!-- Header: menu icon + active chat's title (endi dropdown chevron
           bilan) + o'ng tomonda file/Share tugmalari — Claude.ai'dagi
           header'ga vizual moslik uchun (screenshot solishtiruvi asosida
           qo'shildi: asl versiyada bular yo'q edi, faqat menu+title bor edi). -->
      <header id="chat-header" class="shrink-0 h-14 flex items-center gap-1 px-2">
        <button id="header-menu-btn" title="Chats"
                class="shrink-0 flex items-center justify-center w-9 h-9 rounded-lg hover:bg-[#2a2a2a] text-[#ececec]">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <line x1="9" y1="4" x2="9" y2="20"/>
          </svg>
        </button>
        <button id="chat-title-btn" class="flex items-center gap-1 px-1 py-1 rounded-lg hover:bg-[#2a2a2a] min-w-0" style="max-width:60%;">
          <span id="chat-title" class="text-[15px] font-medium text-[#ececec] truncate">MRagent</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0 text-[#8e8e8e]">
            <polyline points="6 9 12 15 18 9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="flex-1"></div>
        <button id="header-file-btn" title="Files"
                class="shrink-0 flex items-center justify-center w-9 h-9 rounded-lg hover:bg-[#2a2a2a] text-[#ececec]">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke-linejoin="round"/>
            <path d="M14 2v6h6" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="header-share-btn"
                class="shrink-0 text-[13px] font-medium px-3 py-1.5 rounded-lg hover:bg-[#2a2a2a] text-[#ececec] border"
                style="border-color:#3a3a3a;">
          Share
        </button>
      </header>
      <main id="chat" class="flex-1 overflow-y-auto w-full"><div id="chat-inner" class="px-4 py-6 space-y-6 max-w-[720px] mx-auto w-full"></div></main>

      <!-- Empty-state: centered greeting + input, ChatGPT-style. Hidden the
           moment the first message goes out; the bottom-pinned footer
           below takes over from then on. -->
      <div id="empty-state" class="absolute inset-x-0 bottom-0 top-14 flex flex-col items-center justify-center px-4">
        <div class="w-full max-w-[720px]">
          <div class="text-center text-[#ececec] text-2xl font-medium mb-6" id="welcome">
            Hey! What are we building today?
          </div>
          <div id="composer-slot-empty"></div>
        </div>
      </div>

      <!-- Bottom-pinned footer: shown once the conversation has messages. -->
      <footer id="chat-footer" class="px-4 pb-6 pt-2 hidden">
        <div id="composer-slot-footer"></div>
      </footer>
    </div>

    <!-- =================== REAL BASH TERMINAL =================== -->
    <!-- Raw PTY over WebSocket straight to the machine, bypassing the AI
         entirely. Hidden by default; toggled by the "Bash" sidebar button. -->
    <div id="term-panel" class="hidden flex-1 flex flex-col min-w-0" style="background:var(--bg-code);">
      <div class="flex items-center justify-between px-4 py-2.5 border-b shrink-0" style="border-color:#2a2a2a;">
        <div class="flex items-center gap-2 text-[13px] text-[#a8a8a8]">
          <span class="w-2 h-2 rounded-full shrink-0" id="term-status-dot" style="background:#f2555a;"></span>
          <span id="term-status-text">connecting...</span>
        </div>
        <button id="term-close-btn" class="text-[12px] text-[#8e8e8e] hover:text-[#ececec] px-2 py-1">
          close
        </button>
      </div>
      <div id="term-container" class="flex-1 min-h-0 p-2"></div>
    </div>

    <!-- =================== REPLAY MODE =================== -->
    <!-- OS darajasidagi mouse/keyboard record+playback (evdev + ydotool).
         LLM ishtirokisiz, token sarflanmaydi. "Bash" panel bilan bir xil
         toggle naqshi: chat-panel yashiriladi, bu panel ko'rsatiladi. -->
    <div id="replay-panel" class="hidden flex-1 flex flex-col min-w-0" style="background:var(--bg-code);">
      <div class="flex items-center justify-between px-4 py-2.5 border-b shrink-0" style="border-color:#2a2a2a;">
        <span class="text-[13px] text-[#a8a8a8]">Replay Mode</span>
        <button id="replay-close-btn" class="text-[12px] text-[#8e8e8e] hover:text-[#ececec] px-2 py-1">
          close
        </button>
      </div>
      <div class="px-4 py-3 shrink-0">
        <button id="add-replay-project-btn"
                class="w-full py-2 rounded-lg text-[#ececec] hover:bg-[#3a3a3a] text-[13px]"
                style="background:#2a2a2a;">
          + Add Replay Project
        </button>
      </div>
      <div id="replay-list" class="flex-1 overflow-y-auto px-4 space-y-1 text-[13px]"></div>
    </div>
  </div>

  <!-- =================== LOGOUT / CACHE-CLEAR OVERLAY =================== -->
  <!-- login-screen bilan bir xil vizual til: shrift, ranglar, kartochka.
       Faqat logout paytida ko'rinadi, "hidden" bilan boshlanadi. Ichidagi
       raqam va progress-bar JS orqali (doLogout ichida) jonlantiriladi. -->
  <div id="logout-overlay" class="hidden h-screen w-screen flex items-center justify-center fixed inset-0 z-[999]" style="background:var(--bg);">
    <div class="login-card w-full max-w-[400px] p-8 space-y-6 text-center">
      <div class="w-9 h-9 mx-auto">
        <img src="assets/MRagent-logo.svg" alt="MRagent" width="100%" height="100%" />
      </div>
      <div class="space-y-1">
        <h1 class="font-semibold text-xl tracking-tight text-[#ececec]">Signing out</h1>
        <p id="logout-status-text" class="text-[13px] text-[#8e8e8e]">Clearing local session…</p>
      </div>
      <div class="space-y-2">
        <div class="w-full h-1.5 rounded-full overflow-hidden" style="background:#2a2a2a;">
          <div id="logout-progress-bar" class="h-full rounded-full" style="width:0%; background:#e0703a; transition: width 120ms linear;"></div>
        </div>
        <p id="logout-bytes-text" class="text-[12px] text-[#8e8e8e] tabular-nums">0.000 B cleared</p>
      </div>
    </div>
  </div>

  <!-- ===== VAQTINCHALIK DEBUG KONSOL (ERUDA) =====
       Mobil qurilmada F12 yo'q, shuning uchun on-screen console kerak.
       Bug topilgach BU BLOK O'CHIRILADI — production'da doim qolmaydi
       (tashqi CDN'ga bog'liqlik + ekranda ortiqcha tugma, foydalanuvchiga
       kerak emas). ["mrai-debug"="0"] localStorage bilan o'chirib qo'yish
       ham mumkin, lekin hozircha shartsiz yoqilgan — tezroq topish uchun.
  -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <!-- ===== DEBUG KONSOL TUGADI ===== -->

  <script type="module" src="js/main.js"></script>
</body>
</html>
