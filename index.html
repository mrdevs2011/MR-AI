<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mragent</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='44' fill='%23ececec'/%3E%3Cpath d='M46 148 L46 62 L74 62 L100 112 L126 62 L154 62 L154 148 L132 148 L132 92 L106 140 L94 140 L68 92 L68 148 Z' fill='%23212121'/%3E%3Ccircle cx='164' cy='40' r='15' fill='%238e5cf7'/%3E%3Ccircle cx='164' cy='40' r='5' fill='%23ececec'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <style>
    * { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif; }
    body { background: #212121; }
    #chat { scrollbar-width: thin; scrollbar-color: #4d4d4d transparent; }
    #chat-history { scrollbar-width: thin; scrollbar-color: #4d4d4d transparent; }
    .bubble-user { background: #2f2f2f; color: #ececec; }
    .bubble-bot { color: #ececec; }
    .bubble-pending { background: #2a2213; border: 1px solid #4a3a10; }
    .login-input {
      background: #2f2f2f;
      border: 1px solid #4d4d4d;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .login-input:focus {
      border-color: #8e8e8e;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
    }
    .login-card {
      background: #212121;
    }
    .sidebar-item {
      transition: background-color .12s ease;
    }

    /* ---- thinking / live thought-process animation ---- */
    .thinking-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
      color: #a8a8a8;
      font-size: 13.5px;
    }
    .thinking-dot-orb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #b98cff, #8e5cf7 70%);
      box-shadow: 0 0 8px rgba(142, 92, 247, 0.55);
      animation: orbPulse 1.1s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes orbPulse {
      0%, 100% { transform: scale(0.75); opacity: 0.55; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    .thinking-dots span {
      animation: dotBlink 1.2s infinite;
      opacity: 0.2;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBlink {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }
    .thought-log {
      display: flex;
      flex-direction: column;
      gap: 3px;
      border-left: 2px solid #3a3a3a;
      padding-left: 12px;
      margin-bottom: 4px;
    }
    .thought-line {
      font-size: 12.5px;
      color: #6f6f6f;
      display: flex;
      align-items: center;
      gap: 6px;
      animation: fadeInThought .25s ease;
    }
    .thought-line.current { color: #a8a8a8; }
    .thought-line .check {
      color: #7fd68b;
      flex-shrink: 0;
    }
    @keyframes fadeInThought {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="text-[#ececec] h-screen flex flex-col" style="background:#212121;">

  <!-- =================== BOOT (checking auth) =================== -->
  <div id="boot-screen" class="h-screen w-screen flex items-center justify-center" style="background:#212121;">
    <div class="flex flex-col items-center gap-3">
      <div class="w-6 h-6 rounded-full border-2 border-[#4d4d4d] border-t-[#ececec] animate-spin"></div>
    </div>
  </div>

  <!-- =================== LOGIN SCREEN =================== -->
  <div id="login-screen" class="hidden h-screen w-screen flex items-center justify-center" style="background:#212121;">
    <form id="login-form" class="login-card w-full max-w-[400px] p-8 space-y-6">
      <div class="text-center space-y-2">
        <div class="w-9 h-9 mx-auto">
          <svg width="100%" height="100%" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img"><title>mragent</title><rect x="0" y="0" width="200" height="200" rx="44" fill="#ececec"/><path d="M46 148 L46 62 L74 62 L100 112 L126 62 L154 62 L154 148 L132 148 L132 92 L106 140 L94 140 L68 92 L68 148 Z" fill="#212121"/><circle cx="164" cy="40" r="15" fill="#8e5cf7"/><circle cx="164" cy="40" r="5" fill="#ececec"/></svg>
        </div>
        <h1 class="font-semibold text-2xl tracking-tight text-[#ececec]">Continue to mragent</h1>
      </div>

      <div class="space-y-3">
        <div class="space-y-1.5">
          <input id="login-pass" type="password" autocomplete="current-password"
                 class="login-input w-full rounded-xl px-4 py-3 text-[15px] text-[#ececec] focus:outline-none placeholder:text-[#8e8e8e]"
                 placeholder="Login password" required />
        </div>

        <div class="space-y-1.5">
          <input id="login-token" type="password" autocomplete="off"
                 class="login-input w-full rounded-xl px-4 py-3 text-[15px] text-[#ececec] focus:outline-none placeholder:text-[#8e8e8e]"
                 placeholder="Auth token" required />
        </div>
      </div>

      <p id="login-error" class="text-[13px] text-[#f2555a] hidden">Wrong password or token, or the backend didn't respond.</p>

      <button type="submit" id="login-btn"
              class="w-full bg-[#ececec] hover:bg-white text-[#212121] rounded-xl py-3 text-[15px] font-medium transition disabled:opacity-40">
        Continue
      </button>

      <p class="text-[13px] text-[#8e8e8e] text-center" id="login-tunnel-status">looking for tunnel...</p>
    </form>
  </div>

  <!-- =================== CHAT APP (shown after login) =================== -->
  <div id="app-screen" class="hidden h-screen flex" style="background:#212121;">

    <!-- =================== SIDEBAR =================== -->
    <aside class="w-64 shrink-0 flex flex-col" style="background:#171717;">
      <div class="px-3 py-3">
        <button id="new-chat-btn"
                class="sidebar-item w-full flex items-center gap-2.5 hover:bg-[#2a2a2a] rounded-lg px-3 py-2.5 text-sm text-[#ececec] text-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0">
            <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
          </svg>
          New chat
        </button>
      </div>

      <div class="px-3 mt-2">
        <p class="text-xs font-medium text-[#8e8e8e] px-3 mb-1">Projects</p>
        <div class="text-sm text-[#d9d9d9]">
          <button class="sidebar-item w-full text-left px-3 py-2 rounded-lg hover:bg-[#2a2a2a] flex items-center gap-2.5">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0 text-[#8e8e8e]"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
            general
          </button>
          <button class="sidebar-item w-full text-left px-3 py-2 rounded-lg hover:bg-[#2a2a2a] flex items-center gap-2.5">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0 text-[#8e8e8e]"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
            chat
          </button>
        </div>
      </div>

      <div class="px-3 mt-4 flex-1 min-h-0 flex flex-col">
        <p class="text-xs font-medium text-[#8e8e8e] px-3 mb-1">Chats</p>
        <div id="chat-history" class="text-sm text-[#d9d9d9] overflow-y-auto flex-1 min-h-0">
          <!-- filled by JS -->
        </div>
      </div>

      <div class="px-2 py-2 flex items-center justify-between">
        <div class="sidebar-item flex-1 flex items-center gap-2.5 rounded-lg px-2 py-2 min-w-0 hover:bg-[#2a2a2a]">
          <div class="w-7 h-7 rounded-full overflow-hidden shrink-0" style="background:#ececec;">
            <svg width="100%" height="100%" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img"><title>mragent</title><rect x="0" y="0" width="200" height="200" fill="#ececec"/><path d="M46 148 L46 62 L74 62 L100 112 L126 62 L154 62 L154 148 L132 148 L132 92 L106 140 L94 140 L68 92 L68 148 Z" fill="#212121"/><circle cx="164" cy="40" r="15" fill="#8e5cf7"/><circle cx="164" cy="40" r="5" fill="#ececec"/></svg>
          </div>
          <div class="min-w-0">
            <p class="text-[13px] truncate text-[#ececec]">mragent</p>
            <p class="text-[11px] text-[#8e8e8e]" id="tunnel-status">connecting...</p>
          </div>
        </div>
        <button id="logout-btn" class="text-[12px] text-[#8e8e8e] hover:text-[#ececec] px-2 py-1.5 shrink-0">
          sign out
        </button>
      </div>
    </aside>

    <!-- =================== MAIN CHAT =================== -->
    <div class="flex-1 flex flex-col min-w-0" style="background:#212121;">
      <main id="chat" class="flex-1 overflow-y-auto px-4 py-6 space-y-6 max-w-[720px] mx-auto w-full">
        <div class="text-center text-[#ececec] text-2xl font-medium py-20" id="welcome">
          Hey! What are we building today? 👋
        </div>
      </main>

      <footer class="px-4 pb-6 pt-2">
        <div class="max-w-[720px] mx-auto mb-2 flex gap-3 text-[12px] text-[#8e8e8e]">
          <input id="category" type="text" value="general" class="bg-transparent border-b border-[#3a3a3a] w-28 focus:outline-none focus:border-[#8e8e8e] transition" />
          <input id="filename" type="text" value="chat" class="bg-transparent border-b border-[#3a3a3a] w-28 focus:outline-none focus:border-[#8e8e8e] transition" />
        </div>
        <div class="max-w-[720px] mx-auto flex items-center gap-2 rounded-3xl px-3 py-2" style="background:#2f2f2f;">
          <input id="message" type="text" placeholder="Type a message..."
                 class="flex-1 bg-transparent px-2 py-2 text-[15px] text-[#ececec] focus:outline-none placeholder:text-[#8e8e8e]"
                 autocomplete="off" />
          <button id="send" class="bg-[#ececec] hover:bg-white text-[#212121] w-9 h-9 rounded-full flex items-center justify-center transition disabled:opacity-30 shrink-0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </footer>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDYkT1b_SOg5T76yhpyRuqnem9YsG53Qn0",
      authDomain: "mragent-2d280.firebaseapp.com",
      projectId: "mragent-2d280",
      storageBucket: "mragent-2d280.firebasestorage.app",
      messagingSenderId: "654437071743",
      appId: "1:654437071743:web:7281d306d8c6cd054c784a",
      measurementId: "G-MZEC0M55WH"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let API_BASE = null;
    let LOGIN_PASS = "";
    let AUTH_TOKEN = "";

    const bootScreen = document.getElementById("boot-screen");
    const loginScreen = document.getElementById("login-screen");
    const appScreen = document.getElementById("app-screen");
    const loginForm = document.getElementById("login-form");
    const loginPass = document.getElementById("login-pass");
    const loginToken = document.getElementById("login-token");
    const loginError = document.getElementById("login-error");
    const loginBtn = document.getElementById("login-btn");
    const loginTunnelStatus = document.getElementById("login-tunnel-status");

    const chat = document.getElementById("chat");
    const input = document.getElementById("message");
    const sendBtn = document.getElementById("send");
    const tunnelStatus = document.getElementById("tunnel-status");
    const logoutBtn = document.getElementById("logout-btn");
    const newChatBtn = document.getElementById("new-chat-btn");
    const chatHistoryEl = document.getElementById("chat-history");
    const welcomeEl = document.getElementById("welcome");

    // ---------------------------------------------------------------------
    // CHAT HISTORY — stored on-device (localStorage), independent of the
    // backend. Each chat: { id, title, messages: [{text, kind}] }
    // ---------------------------------------------------------------------
    const CHATS_KEY = "mragent_chats";
    let chats = [];
    let activeChatId = null;

    function loadChats() {
      try {
        chats = JSON.parse(localStorage.getItem(CHATS_KEY) || "[]");
      } catch {
        chats = [];
      }
    }

    function saveChats() {
      localStorage.setItem(CHATS_KEY, JSON.stringify(chats));
    }

    function getActiveChat() {
      return chats.find(c => c.id === activeChatId) || null;
    }

    function renderChatHistory() {
      chatHistoryEl.innerHTML = "";
      if (chats.length === 0) {
        chatHistoryEl.innerHTML = `<p class="text-xs text-gray-600 px-2 py-1">no chats yet</p>`;
        return;
      }
      // newest first
      [...chats].reverse().forEach(c => {
        const btn = document.createElement("button");
        const isActive = c.id === activeChatId;
        btn.className = `sidebar-item w-full text-left px-3 py-2 rounded-lg truncate ${isActive ? "bg-[#2a2a2a] text-[#ececec]" : "hover:bg-[#2a2a2a] text-[#d9d9d9]"}`;
        btn.textContent = c.title || "New chat";
        btn.addEventListener("click", () => switchChat(c.id));
        chatHistoryEl.appendChild(btn);
      });
    }

    function renderMessages() {
      chat.innerHTML = "";
      const active = getActiveChat();
      if (!active || active.messages.length === 0) {
        chat.innerHTML = `<div class="text-center text-[#ececec] text-2xl font-medium py-20" id="welcome">What do you want to get done?</div>`;
        return;
      }
      active.messages.forEach(m => addMessage(m.text, m.kind, false));
    }

    function switchChat(id) {
      activeChatId = id;
      renderChatHistory();
      renderMessages();
      input.focus();
    }

    function createNewChat() {
      const newChat = { id: Date.now().toString(36), title: "New chat", messages: [] };
      chats.push(newChat);
      saveChats();
      switchChat(newChat.id);
    }

    function ensureActiveChat() {
      if (chats.length === 0) {
        createNewChat();
      } else if (!activeChatId) {
        switchChat(chats[chats.length - 1].id);
      }
    }

    newChatBtn.addEventListener("click", createNewChat);

    function showApp() {
      bootScreen.classList.add("hidden");
      loginScreen.classList.add("hidden");
      appScreen.classList.remove("hidden");
      tunnelStatus.textContent = "connected";
      tunnelStatus.classList.add("text-green-500");
      loadChats();
      ensureActiveChat();
      input.focus();
    }

    function showLogin(errorMsg) {
      bootScreen.classList.add("hidden");
      appScreen.classList.add("hidden");
      loginScreen.classList.remove("hidden");
      LOGIN_PASS = "";
      AUTH_TOKEN = "";
      localStorage.removeItem("mragent_pass");
      localStorage.removeItem("mragent_token");
      loginBtn.disabled = false;
      loginBtn.textContent = "Continue";
      if (errorMsg) {
        loginError.textContent = errorMsg;
        loginError.classList.remove("hidden");
      } else {
        loginError.classList.add("hidden");
      }
      loginPass.value = "";
      loginToken.value = "";
      loginPass.focus();
    }

    async function loadTunnelUrl() {
      try {
        const doc = await db.collection("config").doc("tunnel").get();
        if (doc.exists && doc.data().url) {
          API_BASE = doc.data().url.replace(/\/$/, "");
          loginTunnelStatus.textContent = "tunnel connected, enter your password";
        } else {
          loginTunnelStatus.textContent = "tunnel not found (Firestore empty)";
        }
      } catch (e) {
        loginTunnelStatus.textContent = "Firestore error";
        console.error(e);
      }
    }

    // No dedicated endpoint exists just to check credentials, so we ping
    // /chat with a harmless sentinel message and read the status code.
    // This never triggers a real action, it only confirms auth.
    async function verifyToken(pass, token) {
      const res = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Auth-Token": token,
          "X-Login-Pass": pass
        },
        body: JSON.stringify({ message: "__mragent_auth_check__", category: "_auth", filename: "check" })
      });
      return res.status !== 401;
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!API_BASE) {
        loginError.textContent = "Tunnel not found yet, wait a moment and try again.";
        loginError.classList.remove("hidden");
        return;
      }
      const pass = loginPass.value.trim();
      const token = loginToken.value.trim();
      if (!pass || !token) return;

      loginBtn.disabled = true;
      loginBtn.textContent = "Checking...";
      loginError.classList.add("hidden");

      try {
        const ok = await verifyToken(pass, token);
        if (ok) {
          LOGIN_PASS = pass;
          AUTH_TOKEN = token;
          localStorage.setItem("mragent_pass", LOGIN_PASS);
          localStorage.setItem("mragent_token", AUTH_TOKEN);
          showApp();
        } else {
          showLogin("Wrong password or token.");
        }
      } catch (err) {
        showLogin("Couldn't reach the backend. Is the tunnel up?");
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Continue";
      }
    });

    logoutBtn.addEventListener("click", () => {
      showLogin();
    });

    function addMessage(text, kind = "bot", persist = true) {
      const div = document.createElement("div");
      const isUser = kind === "user";
      const isPending = kind === "pending";
      div.className = `flex ${isUser ? "justify-end" : "justify-start"}`;
      if (isUser) {
        div.innerHTML = `
          <div class="max-w-[85%] rounded-3xl px-4 py-2.5 text-[15px] leading-relaxed bubble-user">
            <pre class="whitespace-pre-wrap font-sans">${escapeHtml(text)}</pre>
          </div>`;
      } else {
        const bubbleClass = isPending ? "bubble-pending rounded-2xl px-4 py-2.5" : "bubble-bot";
        div.innerHTML = `
          <div class="max-w-full w-full text-[15px] leading-relaxed ${bubbleClass}">
            <pre class="whitespace-pre-wrap font-sans">${escapeHtml(text)}</pre>
          </div>`;
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;

      if (persist) {
        const active = getActiveChat();
        if (active) {
          active.messages.push({ text, kind });
          if (isUser && active.title === "New chat") {
            active.title = text.slice(0, 40);
            renderChatHistory();
          }
          saveChats();
        }
      }
      return div;
    }

    const ACTION_LABELS = {
      command: "💻 command",
      read_file: "📄 read",
      write_file: "✍️ write",
      list_dir: "📂 folder",
      web_search: "🔎 search"
    };

    const ACTION_VERBS = {
      command: "Running command",
      read_file: "Reading file",
      write_file: "Writing file",
      list_dir: "Listing folder",
      web_search: "Searching the web"
    };

    // -----------------------------------------------------------------
    // LIVE THOUGHT-PROCESS PANEL
    // Backend streams real Server-Sent Events for every step of its
    // agent loop: "thinking" while the model is deciding, "action" once
    // it picked something, "step_result" once that action finished. This
    // renders that live, instead of a fake spinner — every line reflects
    // something that is actually happening on the backend right now.
    // -----------------------------------------------------------------
    function createThoughtPanel() {
      const wrapper = document.createElement("div");
      wrapper.className = "flex justify-start w-full";
      wrapper.innerHTML = `
        <div class="max-w-full w-full rounded-2xl px-4 py-3" style="background:#262626;">
          <div class="thought-log" id="thought-log"></div>
          <div class="thinking-row" id="thinking-row">
            <div class="thinking-dot-orb"></div>
            <span id="thinking-label">Thinking</span>
            <span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span>
          </div>
        </div>`;
      chat.appendChild(wrapper);
      chat.scrollTop = chat.scrollHeight;

      const logEl = wrapper.querySelector("#thought-log");
      const rowEl = wrapper.querySelector("#thinking-row");
      const labelEl = wrapper.querySelector("#thinking-label");

      return {
        el: wrapper,
        setLabel(text) {
          labelEl.textContent = text;
          chat.scrollTop = chat.scrollHeight;
        },
        commitLine(text) {
          // Freeze the current line into the log with a checkmark, then
          // keep the animated row going for whatever comes next.
          const line = document.createElement("div");
          line.className = "thought-line";
          line.innerHTML = `<span class="check">✓</span><span>${escapeHtml(text)}</span>`;
          logEl.appendChild(line);
          chat.scrollTop = chat.scrollHeight;
        },
        remove() {
          wrapper.remove();
        }
      };
    }

    function addStepsTrail(steps) {
      if (!steps || !steps.length) return;
      const div = document.createElement("div");
      div.className = "flex justify-start w-full";
      const items = steps.map(s => {
        const label = ACTION_LABELS[s.action] || s.action;
        const target = s.command || s.path || s.query || "";
        const result = (s.result || "").slice(0, 400);
        return `
          <details class="text-[13px] text-[#a8a8a8]">
            <summary class="cursor-pointer select-none py-1 hover:text-[#ececec]">${label} — ${escapeHtml(target)}</summary>
            <pre class="whitespace-pre-wrap font-mono text-[12px] text-[#8e8e8e] pl-4 pb-2">${escapeHtml(result)}</pre>
          </details>`;
      }).join("");
      div.innerHTML = `<div class="max-w-full w-full rounded-2xl px-4 py-2" style="background:#262626;">${items}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addConfirmButton(commandId) {
      const div = document.createElement("div");
      div.className = "flex justify-start";
      div.innerHTML = `
        <button class="bg-amber-600 hover:bg-amber-500 text-[13px] px-4 py-2 rounded-full transition" data-cmdid="${commandId}">
          ✓ Confirm and run
        </button>`;
      div.querySelector("button").addEventListener("click", async (e) => {
        e.target.disabled = true;
        e.target.textContent = "running...";
        await confirmCommand(commandId);
        div.remove();
      });
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function confirmCommand(commandId) {
      try {
        const res = await fetch(`${API_BASE}/confirm`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Auth-Token": AUTH_TOKEN,
            "X-Login-Pass": LOGIN_PASS
          },
          body: JSON.stringify({ command_id: commandId })
        });
        if (res.status === 401) {
          showLogin("Session expired, please sign in again.");
          return;
        }
        const data = await res.json();
        addMessage(data.response || data.error || "No response", "bot");
      } catch (err) {
        addMessage("The confirm request failed.", "bot");
      }
    }

    // Parses one or more "data: {...}\n\n" SSE frames out of a raw text
    // buffer, returning the parsed events plus whatever partial frame is
    // still incomplete (to be prepended to the next chunk).
    function parseSseChunk(buffer) {
      const events = [];
      const parts = buffer.split("\n\n");
      const remainder = parts.pop(); // last part may be incomplete
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith("data:")) continue;
        const jsonStr = line.slice(5).trim();
        if (!jsonStr) continue;
        try {
          events.push(JSON.parse(jsonStr));
        } catch (e) {
          console.error("Bad SSE frame:", jsonStr, e);
        }
      }
      return { events, remainder };
    }

    async function sendMessage() {
      if (!API_BASE) return;
      const message = input.value.trim();
      if (!message) return;

      const category = document.getElementById("category").value.trim() || "general";
      const filename = document.getElementById("filename").value.trim() || "chat";

      addMessage(message, "user");
      input.value = "";
      sendBtn.disabled = true;

      const panel = createThoughtPanel();
      let sawAnyEvent = false;

      try {
        const res = await fetch(`${API_BASE}/chat`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Auth-Token": AUTH_TOKEN,
            "X-Login-Pass": LOGIN_PASS
          },
          body: JSON.stringify({ message, category, filename })
        });

        if (res.status === 401) {
          panel.remove();
          addMessage("Session expired, please sign in again.", "bot");
          showLogin("Session expired, please sign in again.");
          return;
        }

        // Non-streaming fallback (e.g. plain JSON error responses)
        const contentType = res.headers.get("content-type") || "";
        if (!contentType.includes("text/event-stream")) {
          const data = await res.json();
          panel.remove();
          addMessage(data.response || data.error || "No response", "bot");
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let finalSteps = null;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const { events, remainder } = parseSseChunk(buffer);
          buffer = remainder;

          for (const evt of events) {
            sawAnyEvent = true;

            if (evt.type === "thinking") {
              panel.setLabel(
                evt.step > 1 ? `Thinking about the next step (${evt.step}/${evt.max_steps})` : "Thinking"
              );
            } else if (evt.type === "action") {
              const verb = ACTION_VERBS[evt.action] || "Working on it";
              panel.setLabel(`${verb}: ${evt.target}`);
            } else if (evt.type === "step_result") {
              const verb = ACTION_LABELS[evt.action] || evt.action;
              const target = evt.command || evt.path || evt.query || "";
              panel.commitLine(`${verb} — ${target}`);
            } else if (evt.type === "final") {
              finalSteps = evt.steps;
              panel.remove();

              if (evt.kind === "pending_confirmation") {
                addStepsTrail(evt.steps);
                addMessage(evt.response, "pending");
                addConfirmButton(evt.command_id);
              } else if (evt.kind === "blocked") {
                addStepsTrail(evt.steps);
                addMessage(evt.response, "pending");
              } else {
                addStepsTrail(evt.steps);
                addMessage(evt.response || "No response", "bot");
              }
            }
          }
        }

        if (!sawAnyEvent) {
          panel.remove();
          addMessage("No response from the backend.", "bot");
        }
      } catch (err) {
        panel.remove();
        addMessage("Couldn't reach the backend.\nIs the tunnel up?", "bot");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // On load: if localStorage has a saved token, verify it and jump
    // straight into the chat screen — no re-login needed, even after a
    // refresh. Missing or invalid token -> show the login screen.
    async function tryAutoLogin() {
      const savedPass = localStorage.getItem("mragent_pass");
      const savedToken = localStorage.getItem("mragent_token");
      if (!savedPass || !savedToken || !API_BASE) {
        showLogin();
        return;
      }
      try {
        const ok = await verifyToken(savedPass, savedToken);
        if (ok) {
          LOGIN_PASS = savedPass;
          AUTH_TOKEN = savedToken;
          showApp();
        } else {
          showLogin();
        }
      } catch (err) {
        showLogin();
      }
    }

    (async () => {
      await loadTunnelUrl();
      await tryAutoLogin();
    })();
  </script>
</body>
</html>
