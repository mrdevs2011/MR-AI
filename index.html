<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mragent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <style>
    body { background: #0f0f11; }
    #chat { scrollbar-width: thin; scrollbar-color: #333 transparent; }
    .bubble-user { background: #2563eb; }
    .bubble-bot { background: #1e1e24; border: 1px solid #2a2a32; }
    .bubble-pending { background: #3a2a10; border: 1px solid #7a5a1a; }
  </style>
</head>
<body class="text-gray-100 h-screen flex flex-col">

  <!-- =================== BOOT (auth tekshirilayotganda) =================== -->
  <div id="boot-screen" class="h-screen w-screen flex items-center justify-center bg-[#0f0f11]">
    <div class="text-gray-600 text-xs">yuklanmoqda...</div>
  </div>

  <!-- =================== LOGIN SCREEN =================== -->
  <div id="login-screen" class="hidden h-screen w-screen flex items-center justify-center bg-[#0f0f11]">
    <form id="login-form" class="w-full max-w-sm bg-[#17171b] border border-gray-800 rounded-2xl p-8 space-y-5">
      <div class="text-center space-y-1">
        <div class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-sm mx-auto">M</div>
        <h1 class="font-semibold text-lg">mragent</h1>
        <p class="text-xs text-gray-500">Kirish uchun parolni kiriting</p>
      </div>

      <div class="space-y-1">
        <label class="text-xs text-gray-400">Login parol</label>
        <input id="login-pass" type="password" autocomplete="current-password"
               class="w-full bg-[#1e1e24] border border-gray-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition"
               placeholder="••••••••••••••••" required />
      </div>

      <div class="space-y-1">
        <label class="text-xs text-gray-400">Auth token</label>
        <input id="login-token" type="password" autocomplete="off"
               class="w-full bg-[#1e1e24] border border-gray-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition"
               placeholder="server console'da chiqqan token" required />
      </div>

      <p id="login-error" class="text-xs text-red-500 hidden">Parol yoki token noto'g'ri, yoki backend javob bermadi.</p>

      <button type="submit" id="login-btn"
              class="w-full bg-blue-600 hover:bg-blue-500 rounded-lg py-2.5 text-sm font-medium transition disabled:opacity-40">
        Kirish
      </button>

      <p class="text-[11px] text-gray-600 text-center" id="login-tunnel-status">tunnel qidirilmoqda...</p>
    </form>
  </div>

  <!-- =================== CHAT APP (login'dan keyin ko'rinadi) =================== -->
  <div id="app-screen" class="hidden h-screen flex">

    <!-- =================== SIDEBAR =================== -->
    <aside class="w-64 shrink-0 bg-[#0a0a0c] border-r border-gray-800 flex flex-col">
      <div class="px-3 py-4 flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-xs">M</div>
        <span class="font-semibold text-sm">mragent</span>
      </div>

      <div class="px-3">
        <button id="new-chat-btn"
                class="w-full flex items-center gap-2 bg-[#17171b] hover:bg-[#1e1e24] border border-gray-800 rounded-lg px-3 py-2 text-sm transition">
          <span class="text-base leading-none">＋</span> Yangi suhbat
        </button>
      </div>

      <div class="px-3 mt-5">
        <p class="text-[11px] uppercase tracking-wide text-gray-600 px-1 mb-1.5">Projects</p>
        <div class="space-y-0.5 text-sm text-gray-300">
          <button class="w-full text-left px-2 py-1.5 rounded-lg hover:bg-[#17171b] transition flex items-center gap-2">
            <span class="text-gray-500">📁</span> general
          </button>
          <button class="w-full text-left px-2 py-1.5 rounded-lg hover:bg-[#17171b] transition flex items-center gap-2">
            <span class="text-gray-500">📁</span> chat
          </button>
        </div>
      </div>

      <div class="px-3 mt-5 flex-1 min-h-0 flex flex-col">
        <p class="text-[11px] uppercase tracking-wide text-gray-600 px-1 mb-1.5">Chats</p>
        <div id="chat-history" class="space-y-0.5 text-sm text-gray-300 overflow-y-auto flex-1 min-h-0">
          <!-- JS to'ldiradi -->
        </div>
      </div>

      <div class="border-t border-gray-800 px-3 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-7 h-7 rounded-full bg-purple-600 flex items-center justify-center text-[11px] font-semibold shrink-0">MU</div>
          <div class="min-w-0">
            <p class="text-xs truncate">mragent</p>
            <p class="text-[10px] text-gray-500" id="tunnel-status">ulanmoqda...</p>
          </div>
        </div>
        <button id="logout-btn" class="text-[11px] text-gray-500 border border-gray-700 rounded px-2 py-1 hover:border-red-500 hover:text-red-400 shrink-0">
          chiqish
        </button>
      </div>
    </aside>

    <!-- =================== MAIN CHAT =================== -->
    <div class="flex-1 flex flex-col min-w-0">
      <main id="chat" class="flex-1 overflow-y-auto px-4 py-6 space-y-4 max-w-3xl mx-auto w-full">
        <div class="text-center text-gray-500 text-sm py-10" id="welcome">
          Salom! Men mragentman.<br>Nima qilishimni xohlaysan?
        </div>
      </main>

      <footer class="border-t border-gray-800 p-4">
        <div class="max-w-3xl mx-auto mb-2 flex gap-3 text-xs text-gray-500">
          <input id="category" type="text" value="general" class="bg-transparent border-b border-gray-700 w-28 focus:outline-none" />
          <input id="filename" type="text" value="chat" class="bg-transparent border-b border-gray-700 w-28 focus:outline-none" />
        </div>
        <div class="max-w-3xl mx-auto flex gap-3">
          <input id="message" type="text" placeholder="Xabar yozing..."
                 class="flex-1 bg-[#1e1e24] border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition"
                 autocomplete="off" />
          <button id="send" class="bg-blue-600 hover:bg-blue-500 px-5 rounded-xl text-sm font-medium transition disabled:opacity-40">
            Yuborish
          </button>
        </div>
      </footer>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDYkT1b_SOg5T76yhpyRuqnem9YsG53Qn0",
      authDomain: "mragent-2d280.firebaseapp.com",
      projectId: "mragent-2d280",
      storageBucket: "mragent-2d280.firebasestorage.app",
      messagingSenderId: "654437071743",
      appId: "1:654437071743:web:7281d306d8c6cd054c784a",
      measurementId: "G-MZEC0M55WH"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let API_BASE = null;
    let LOGIN_PASS = "";
    let AUTH_TOKEN = "";

    const bootScreen = document.getElementById("boot-screen");
    const loginScreen = document.getElementById("login-screen");
    const appScreen = document.getElementById("app-screen");
    const loginForm = document.getElementById("login-form");
    const loginPass = document.getElementById("login-pass");
    const loginToken = document.getElementById("login-token");
    const loginError = document.getElementById("login-error");
    const loginBtn = document.getElementById("login-btn");
    const loginTunnelStatus = document.getElementById("login-tunnel-status");

    const chat = document.getElementById("chat");
    const input = document.getElementById("message");
    const sendBtn = document.getElementById("send");
    const tunnelStatus = document.getElementById("tunnel-status");
    const logoutBtn = document.getElementById("logout-btn");
    const newChatBtn = document.getElementById("new-chat-btn");
    const chatHistoryEl = document.getElementById("chat-history");
    const welcomeEl = document.getElementById("welcome");

    // ---------------------------------------------------------------------
    // CHAT TARIXI — komputerda (localStorage) saqlanadi, backendga bog'liq
    // emas. Har bir suhbat: { id, title, messages: [{text, kind}] }
    // ---------------------------------------------------------------------
    const CHATS_KEY = "mragent_chats";
    let chats = [];
    let activeChatId = null;

    function loadChats() {
      try {
        chats = JSON.parse(localStorage.getItem(CHATS_KEY) || "[]");
      } catch {
        chats = [];
      }
    }

    function saveChats() {
      localStorage.setItem(CHATS_KEY, JSON.stringify(chats));
    }

    function getActiveChat() {
      return chats.find(c => c.id === activeChatId) || null;
    }

    function renderChatHistory() {
      chatHistoryEl.innerHTML = "";
      if (chats.length === 0) {
        chatHistoryEl.innerHTML = `<p class="text-xs text-gray-600 px-2 py-1">suhbatlar yo'q</p>`;
        return;
      }
      // eng yangisi tepada
      [...chats].reverse().forEach(c => {
        const btn = document.createElement("button");
        const isActive = c.id === activeChatId;
        btn.className = `w-full text-left px-2 py-1.5 rounded-lg transition truncate ${isActive ? "bg-[#1e1e24] text-gray-100" : "hover:bg-[#17171b] text-gray-400"}`;
        btn.textContent = c.title || "Yangi suhbat";
        btn.addEventListener("click", () => switchChat(c.id));
        chatHistoryEl.appendChild(btn);
      });
    }

    function renderMessages() {
      chat.innerHTML = "";
      const active = getActiveChat();
      if (!active || active.messages.length === 0) {
        chat.innerHTML = `<div class="text-center text-gray-500 text-sm py-10" id="welcome">Salom! Men mragentman.<br>Nima qilishimni xohlaysan?</div>`;
        return;
      }
      active.messages.forEach(m => addMessage(m.text, m.kind, false));
    }

    function switchChat(id) {
      activeChatId = id;
      renderChatHistory();
      renderMessages();
      input.focus();
    }

    function createNewChat() {
      const newChat = { id: Date.now().toString(36), title: "Yangi suhbat", messages: [] };
      chats.push(newChat);
      saveChats();
      switchChat(newChat.id);
    }

    function ensureActiveChat() {
      if (chats.length === 0) {
        createNewChat();
      } else if (!activeChatId) {
        switchChat(chats[chats.length - 1].id);
      }
    }

    newChatBtn.addEventListener("click", createNewChat);

    function showApp() {
      bootScreen.classList.add("hidden");
      loginScreen.classList.add("hidden");
      appScreen.classList.remove("hidden");
      tunnelStatus.textContent = "ulandi";
      tunnelStatus.classList.add("text-green-500");
      loadChats();
      ensureActiveChat();
      input.focus();
    }

    function showLogin(errorMsg) {
      bootScreen.classList.add("hidden");
      appScreen.classList.add("hidden");
      loginScreen.classList.remove("hidden");
      LOGIN_PASS = "";
      AUTH_TOKEN = "";
      localStorage.removeItem("mragent_pass");
      localStorage.removeItem("mragent_token");
      loginBtn.disabled = false;
      loginBtn.textContent = "Kirish";
      if (errorMsg) {
        loginError.textContent = errorMsg;
        loginError.classList.remove("hidden");
      } else {
        loginError.classList.add("hidden");
      }
      loginPass.value = "";
      loginToken.value = "";
      loginPass.focus();
    }

    // /confirm kabi "haqiqiy" endpoint yo'q parolni tekshirish uchun,
    // shuning uchun /chat'ga bo'sh/ping xabar yuborib, 401 keladimi
    // yo'qmi shu orqali tekshiramiz. Bu haqiqiy komanda bajarmaydi,
    // faqat auth'ni tasdiqlaydi.
    async function verifyToken(pass, token) {
      const res = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Auth-Token": token,
          "X-Login-Pass": pass
        },
        body: JSON.stringify({ message: "__mragent_auth_check__", category: "_auth", filename: "check" })
      });
      return res.status !== 401;
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!API_BASE) {
        loginError.textContent = "Tunnel hali topilmadi, biroz kuting va qayta urinib ko'ring.";
        loginError.classList.remove("hidden");
        return;
      }
      const pass = loginPass.value.trim();
      const token = loginToken.value.trim();
      if (!pass || !token) return;

      loginBtn.disabled = true;
      loginBtn.textContent = "Tekshirilmoqda...";
      loginError.classList.add("hidden");

      try {
        const ok = await verifyToken(pass, token);
        if (ok) {
          LOGIN_PASS = pass;
          AUTH_TOKEN = token;
          localStorage.setItem("mragent_pass", LOGIN_PASS);
          localStorage.setItem("mragent_token", AUTH_TOKEN);
          showApp();
        } else {
          showLogin("Parol yoki token noto'g'ri.");
        }
      } catch (err) {
        showLogin("Backendga ulanib bo'lmadi. Tunnel ishlayaptimi?");
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Kirish";
      }
    });

    logoutBtn.addEventListener("click", () => {
      showLogin();
    });

    function addMessage(text, kind = "bot", persist = true) {
      const div = document.createElement("div");
      const isUser = kind === "user";
      const isPending = kind === "pending";
      div.className = `flex ${isUser ? "justify-end" : "justify-start"}`;
      const bubbleClass = isUser ? "bubble-user" : (isPending ? "bubble-pending" : "bubble-bot");
      div.innerHTML = `
        <div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-sm leading-relaxed ${bubbleClass}">
          <pre class="whitespace-pre-wrap font-sans">${escapeHtml(text)}</pre>
        </div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;

      if (persist) {
        const active = getActiveChat();
        if (active) {
          active.messages.push({ text, kind });
          if (isUser && active.title === "Yangi suhbat") {
            active.title = text.slice(0, 40);
            renderChatHistory();
          }
          saveChats();
        }
      }
      return div;
    }

    function addConfirmButton(commandId) {
      const div = document.createElement("div");
      div.className = "flex justify-start";
      div.innerHTML = `
        <button class="bg-amber-600 hover:bg-amber-500 text-xs px-3 py-2 rounded-lg" data-cmdid="${commandId}">
          ✓ Tasdiqlash va bajarish
        </button>`;
      div.querySelector("button").addEventListener("click", async (e) => {
        e.target.disabled = true;
        e.target.textContent = "bajarilmoqda...";
        await confirmCommand(commandId);
        div.remove();
      });
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function loadTunnelUrl() {
      try {
        const doc = await db.collection("config").doc("tunnel").get();
        if (doc.exists && doc.data().url) {
          API_BASE = doc.data().url.replace(/\/$/, "");
          loginTunnelStatus.textContent = "tunnel ulandi, parolni kiriting";
        } else {
          loginTunnelStatus.textContent = "tunnel topilmadi (Firestore bo'sh)";
        }
      } catch (e) {
        loginTunnelStatus.textContent = "Firestore xatosi";
        console.error(e);
      }
    }
    async function confirmCommand(commandId) {
      try {
        const res = await fetch(`${API_BASE}/confirm`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Auth-Token": AUTH_TOKEN,
            "X-Login-Pass": LOGIN_PASS
          },
          body: JSON.stringify({ command_id: commandId })
        });
        if (res.status === 401) {
          showLogin("Sessiya tugadi, qayta kiring.");
          return;
        }
        const data = await res.json();
        addMessage(data.response || data.error || "Javob yo'q", "bot");
      } catch (err) {
        addMessage("Confirm so'rovi muvaffaqiyatsiz.", "bot");
      }
    }

    async function sendMessage() {
      if (!API_BASE) return;
      const message = input.value.trim();
      if (!message) return;

      const category = document.getElementById("category").value.trim() || "general";
      const filename = document.getElementById("filename").value.trim() || "chat";

      addMessage(message, "user");
      input.value = "";
      sendBtn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/chat`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Auth-Token": AUTH_TOKEN,
            "X-Login-Pass": LOGIN_PASS
          },
          body: JSON.stringify({ message, category, filename })
        });

        if (res.status === 401) {
          addMessage("Sessiya tugadi, qayta kirish kerak.", "bot");
          showLogin("Sessiya tugadi, qayta kiring.");
          return;
        }

        const data = await res.json();

        if (data.type === "pending_confirmation") {
          addMessage(data.response, "pending");
          addConfirmButton(data.command_id);
        } else if (data.type === "blocked") {
          addMessage(data.response, "pending");
        } else {
          addMessage(data.response || data.error || "Javob yo'q", "bot");
        }
      } catch (err) {
        addMessage("Backendga ulanib bo'lmadi.\nTunnel ishlayaptimi?", "bot");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Sahifa ochilganda: localStorage'da eski token bo'lsa, uni tekshirib
    // ko'ramiz va to'g'ri bo'lsa TO'G'RIDAN-TO'G'RI chat ekraniga o'tamiz —
    // login qayta so'ralmaydi, refresh'dan keyin ham. Token yo'q yoki
    // noto'g'ri bo'lsa — login ekrani ko'rsatiladi.
    async function tryAutoLogin() {
      const savedPass = localStorage.getItem("mragent_pass");
      const savedToken = localStorage.getItem("mragent_token");
      if (!savedPass || !savedToken || !API_BASE) {
        showLogin();
        return;
      }
      try {
        const ok = await verifyToken(savedPass, savedToken);
        if (ok) {
          LOGIN_PASS = savedPass;
          AUTH_TOKEN = savedToken;
          showApp();
        } else {
          showLogin();
        }
      } catch (err) {
        showLogin();
      }
    }

    (async () => {
      await loadTunnelUrl();
      await tryAutoLogin();
    })();
  </script>
</body>
</html>
